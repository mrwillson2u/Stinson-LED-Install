; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
	someweisguy/esp_dmx@^4.1.0
	rstephan/ArtnetWifi@^1.6.1
	tzapu/WiFiManager@^2.0.17
	robtillaart/DHTNEW@^0.5.3
	knolleary/PubSubClient@^2.8
monitor_speed = 115200
extra_scripts = pre:extra_script.py

[env:esp32_ota]
extends = env:esp32doit-devkit-v1
upload_protocol = espota
; upload_port = 10.0.1.181 ; This should be set from the .env file otherwise uncomment this
upload_flags = 
	--auth=lonelybinary
	; --host_ip=100.85.112.66
lib_deps = 
	someweisguy/esp_dmx@^4.1.0
	rstephan/ArtnetWifi@^1.6.1
	tzapu/WiFiManager@^2.0.17
	robtillaart/DHTNEW@^0.5.3
	knolleary/PubSubClient@^2.8
; build_flags = !python extra_script.py
extra_scripts = pre:extra_script.py
